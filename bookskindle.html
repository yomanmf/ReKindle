<!DOCTYPE html>
<html lang="en" data-no-scale>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title data-i18n="bookskindle.title">Books to Kindle</title>
    <style>
        :root {
            --shadow: 4px 4px 0 #000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            transition: none !important;
            animation: none !important;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5e5e5;
            color: #000;
            font-family: "Geneva", "Verdana", sans-serif;
            image-rendering: pixelated;
        }

        button, input { border-radius: 0; color: #000; font-family: inherit; }
        button { touch-action: manipulation; }
        [hidden] { display: none !important; }

        .window {
            width: 95%;
            max-width: 720px;
            height: 90vh;
            border: 2px solid #000;
            box-shadow: var(--shadow);
            background: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .title-bar {
            height: 38px;
            border-bottom: 2px solid #000;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px; right: 4px; bottom: 4px; left: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .title-text {
            height: 100%;
            padding: 0 15px;
            background: #fff;
            font-size: 1.05rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            z-index: 1;
        }

        .close-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 48px;
            height: 48px;
            border: 0;
            background: transparent;
            box-shadow: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 0;
            z-index: 2;
        }

        .close-box::after {
            content: "X";
            width: 20px;
            height: 20px;
            border: 2px solid #000;
            background: #fff;
            box-shadow: 2px 2px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .content-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .panel, .notice {
            border: 2px solid #000;
            padding: 14px;
            margin-bottom: 16px;
            background: #fff;
        }

        .notice { border-style: dashed; font-size: 0.85rem; line-height: 1.45; }
        .panel-title { margin: 0 0 12px; font-size: 1rem; text-transform: uppercase; }
        .field { margin-bottom: 14px; }
        .field:last-child { margin-bottom: 0; }
        .field-label { display: block; margin-bottom: 6px; font-size: 0.82rem; font-weight: bold; }

        .text-input {
            width: 100%;
            min-height: 48px;
            border: 2px solid #000;
            padding: 9px;
            background: #fff;
            font-size: 1rem;
        }

        .sys-btn {
            min-height: 48px;
            border: 2px solid #000;
            background: #fff;
            box-shadow: 2px 2px 0 #000;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .sys-btn.primary { background: #000; color: #fff; }
        .sys-btn:disabled { color: #777; box-shadow: none; cursor: default; }
        .sys-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
        .close-box:active::after { transform: translate(2px, 2px); box-shadow: none; }
        .wide-button { width: 100%; }
        .change-action { display: flex; justify-content: center; padding: 10px 16px; flex-shrink: 0; }

        .button-row, .status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .button-row { margin-top: 12px; }

        .summary, .status-card {
            border: 2px solid #000;
            padding: 10px;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .summary-title, .status-value { display: block; font-weight: bold; font-size: 1rem; margin-bottom: 5px; }
        .status-value { display: flex; align-items: center; }
        .status-icon {
            width: 24px;
            height: 24px;
            margin-right: 7px;
            flex: 0 0 auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
        .status-label { display: block; font-size: 0.72rem; font-weight: bold; text-transform: uppercase; }
        .status-detail { display: block; margin-top: 7px; word-break: break-word; white-space: pre-wrap; }

        .result-button {
            width: 100%;
            margin-top: 8px;
            text-align: left;
            line-height: 1.35;
        }

        .status-bar {
            min-height: 28px;
            border-top: 2px solid #000;
            padding: 5px 9px;
            background: #fff;
            font-size: 0.75rem;
            flex-shrink: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(255, 255, 255, 0.92);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10000;
        }

        .modal-box { width: 100%; max-width: 440px; border: 2px solid #000; box-shadow: var(--shadow); background: #fff; }
        .modal-box .title-text { border: none; }
        .modal-content { padding: 18px; }

        @media (max-width: 520px) {
            .status-grid, .button-row { grid-template-columns: 1fr; }
            .content-area { padding: 10px; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="theme.js?v=22"></script>
    <script src="js/i18n.js" data-i18n-file="bookskindle"></script>
    <script src="js/rekindle-cloud.js?v=2"></script>
</head>
<body>
    <main class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <button type="button" class="close-box" onclick="window.location.href='index.html'" aria-label="Close">X</button>
            <span class="title-text" data-i18n="bookskindle.title">Books to Kindle</span>
        </div>

        <div class="content-area">
            <div class="notice" id="auth-notice" hidden>
                <span data-i18n="bookskindle.signin">Sign in to ReKindle before sending books.</span>
                <div class="button-row"><button class="sys-btn primary" type="button" onclick="window.location.href='index.html?login=true'" data-i18n="bookskindle.signin_button">Open sign in</button></div>
            </div>

            <section class="panel" id="kindle-panel" hidden>
                <h1 class="panel-title" data-i18n="bookskindle.kindle">Kindle delivery</h1>
                <div class="field">
                    <label class="field-label" for="kindle-email" data-i18n="bookskindle.email">Send to Kindle address</label>
                    <input class="text-input" id="kindle-email" type="email" maxlength="254" autocomplete="email" placeholder="reader@kindle.com" data-i18n-placeholder="bookskindle.email_placeholder">
                </div>
                <div class="summary">
                    <span class="summary-title" id="kindle-state" data-i18n="bookskindle.checking">Checking...</span>
                    <span id="kindle-detail" data-i18n="bookskindle.kindle_hint">Add the sender address to Amazon's Approved Personal Document E-mail List.</span>
                </div>
                <div class="button-row">
                    <button class="sys-btn primary" type="button" id="kindle-save" data-i18n="bookskindle.save">Save address</button>
                    <button class="sys-btn" type="button" id="kindle-forget" data-i18n="bookskindle.forget">Forget address</button>
                </div>
            </section>

            <form class="panel" id="search-form">
                <h2 class="panel-title" data-i18n="bookskindle.find">Find a book</h2>
                <div class="field">
                    <label class="field-label" for="query" data-i18n="bookskindle.query">Title or author</label>
                    <input class="text-input" id="query" type="search" minlength="2" maxlength="160" required placeholder="War and Peace Tolstoy" data-i18n-placeholder="bookskindle.query_placeholder">
                </div>
                <button class="sys-btn primary wide-button" id="search-button" type="submit" data-i18n="bookskindle.search">Search</button>
            </form>

            <section class="panel" id="results-panel" hidden>
                <h2 class="panel-title" data-i18n="bookskindle.results">Search results</h2>
                <div id="search-results"></div>
            </section>

            <section class="panel" id="job-panel" hidden>
                <h2 class="panel-title" data-i18n="bookskindle.current_job">Current job</h2>
                <div class="status-grid">
                    <div class="status-card">
                        <span class="status-label" data-i18n="bookskindle.state">State</span>
                        <span class="status-value" id="job-state"></span>
                    </div>
                    <div class="status-card">
                        <span class="status-label" data-i18n="bookskindle.book">Book</span>
                        <span class="status-value" id="job-book"></span>
                    </div>
                </div>
                <span class="status-detail" id="job-detail"></span>
                <div class="button-row">
                    <button class="sys-btn" type="button" id="job-refresh" data-i18n="bookskindle.refresh">Refresh</button>
                    <button class="sys-btn" type="button" id="job-action"></button>
                </div>
            </section>
        </div>

        <section class="change-action" id="kindle-change-panel" hidden>
            <div class="no-invert"><button class="sys-btn primary" type="button" id="kindle-change" data-i18n="bookskindle.change">Change address</button></div>
        </section>

        <div class="status-bar" id="status-bar" data-i18n="bookskindle.loading">Loading Books to Kindle...</div>
    </main>

    <div class="modal-overlay" id="error-modal" role="dialog" aria-modal="true" aria-labelledby="error-title">
        <div class="modal-box">
            <div class="title-bar">
                <div class="title-stripes"></div>
                <span class="title-text" id="error-title" data-i18n="bookskindle.error_title">Books to Kindle error</span>
            </div>
            <div class="modal-content">
                <p id="error-message"></p>
                <button class="sys-btn primary wide-button" type="button" id="error-close" data-i18n="bookskindle.ok">OK</button>
            </div>
        </div>
    </div>

    <script>
        window.rekindleBooksKindleFirebaseConfig = {
            apiKey: "__REKINDLE_FIREBASE_API_KEY__",
            authDomain: "rekindle-fork.firebaseapp.com",
            projectId: "rekindle-fork"
        };
    </script>
    <script src="js/bookskindle.js?v=7"></script>
</body>
</html>
