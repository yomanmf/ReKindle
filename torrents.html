<!DOCTYPE html>
<html lang="en" data-no-scale>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title data-i18n="torrents.title">Downloads</title>
    <style>
        :root {
            --shadow: 4px 4px 0 #000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            transition: none !important;
            animation: none !important;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5e5e5;
            color: #000;
            font-family: "Geneva", "Verdana", sans-serif;
            image-rendering: pixelated;
        }

        button { border-radius: 0; color: #000; font-family: inherit; touch-action: manipulation; }
        [hidden] { display: none !important; }

        .window {
            width: 95%;
            max-width: 720px;
            height: 90vh;
            border: 2px solid #000;
            box-shadow: var(--shadow);
            background: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .title-bar {
            height: 38px;
            border-bottom: 2px solid #000;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px; right: 4px; bottom: 4px; left: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .title-text {
            height: 100%;
            padding: 0 15px;
            background: #fff;
            font-size: 1.05rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            z-index: 1;
        }

        .close-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 48px;
            height: 48px;
            border: 0;
            background: transparent;
            box-shadow: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 0;
            z-index: 2;
        }

        .close-box::after {
            content: "X";
            width: 20px;
            height: 20px;
            border: 2px solid #000;
            background: #fff;
            box-shadow: 2px 2px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .content-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .panel, .notice, .torrent-card {
            border: 2px solid #000;
            padding: 14px;
            margin-bottom: 14px;
            background: #fff;
        }

        .notice { border-style: dashed; font-size: 0.85rem; }
        .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
        .toolbar-title { margin: 0; font-size: 1rem; text-transform: uppercase; }
        .toolbar-summary { display: block; margin-top: 4px; font-size: 0.78rem; }
        .filter-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }

        .sys-btn {
            min-height: 48px;
            border: 2px solid #000;
            background: #fff;
            box-shadow: 2px 2px 0 #000;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .sys-btn.primary { background: #000; color: #fff; }
        .sys-btn:disabled { color: #777; box-shadow: none; cursor: default; }
        .sys-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
        .close-box:active::after { transform: translate(2px, 2px); box-shadow: none; }

        .torrent-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
        .torrent-name { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
        .torrent-state { border: 1px solid #000; padding: 3px 5px; font-size: 0.72rem; font-weight: bold; text-transform: uppercase; }

        .progress-track { height: 18px; margin: 12px 0 6px; border: 2px solid #000; background: #fff; }
        .progress-fill { display: block; height: 100%; background: #000; }
        .progress-text { display: block; margin-bottom: 10px; font-size: 0.8rem; font-weight: bold; }
        .torrent-details { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
        .metric { border-top: 1px solid #000; padding-top: 6px; font-size: 0.78rem; overflow-wrap: anywhere; }
        .metric-label { display: block; margin-bottom: 3px; font-size: 0.68rem; font-weight: bold; text-transform: uppercase; }
        .delete-button { width: 100%; }
        .empty-state { border: 2px dashed #000; padding: 24px 14px; text-align: center; }

        .status-bar {
            min-height: 28px;
            border-top: 2px solid #000;
            padding: 5px 9px;
            background: #fff;
            font-size: 0.75rem;
            flex-shrink: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(255, 255, 255, 0.92);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10000;
        }

        .modal-box { width: 100%; max-width: 460px; border: 2px solid #000; box-shadow: var(--shadow); background: #fff; }
        .modal-box .title-text { border: none; }
        .modal-content { padding: 18px; overflow-wrap: anywhere; }
        .button-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
        .button-row.single { grid-template-columns: 1fr; }

        @media (max-width: 520px) {
            .content-area { padding: 10px; }
            .torrent-details { grid-template-columns: 1fr; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="theme.js?v=26"></script>
    <script src="js/i18n.js" data-i18n-file="torrents"></script>
    <script src="js/rekindle-cloud.js?v=2"></script>
</head>
<body>
    <main class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <button type="button" class="close-box" onclick="window.location.href='index.html'" aria-label="Close">X</button>
            <span class="title-text" data-i18n="torrents.title">Downloads</span>
        </div>

        <div class="content-area">
            <div class="notice" id="auth-notice" hidden>
                <span data-i18n="torrents.signin">Sign in to ReKindle to manage downloads.</span>
                <div class="button-row single"><button class="sys-btn primary" type="button" onclick="window.location.href='index.html?login=true'" data-i18n="torrents.signin_button">Open sign in</button></div>
            </div>

            <section id="downloads-panel" hidden>
                <div class="panel toolbar">
                    <div>
                        <h1 class="toolbar-title" id="downloads-title" data-i18n="torrents.all">All downloads</h1>
                        <span class="toolbar-summary" id="torrent-count"></span>
                    </div>
                    <button class="sys-btn" type="button" id="refresh-button" data-i18n="torrents.refresh">Refresh</button>
                </div>
                <div class="filter-row" role="group" aria-label="Download filter">
                    <button class="sys-btn primary" type="button" id="filter-all" aria-pressed="true" data-i18n="torrents.filter_all">All</button>
                    <button class="sys-btn" type="button" id="filter-completed" aria-pressed="false" data-i18n="torrents.filter_completed">Completed</button>
                </div>
                <div id="torrent-list" aria-live="polite"></div>
                <div class="empty-state" id="empty-state" hidden data-i18n="torrents.empty">No torrent tasks.</div>
            </section>
        </div>

        <div class="status-bar" id="status-bar" data-i18n="torrents.ready">Ready</div>
    </main>

    <div class="modal-overlay" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title">
        <div class="modal-box">
            <div class="title-bar"><div class="title-stripes"></div><span class="title-text" id="delete-title" data-i18n="torrents.delete_title">Delete download</span></div>
            <div class="modal-content">
                <div id="delete-message"></div>
                <div class="button-row">
                    <button class="sys-btn" type="button" id="delete-cancel" data-i18n="torrents.cancel">Cancel</button>
                    <button class="sys-btn primary" type="button" id="delete-confirm" data-i18n="torrents.delete_confirm">Delete task and files</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="error-modal" role="dialog" aria-modal="true" aria-labelledby="error-title">
        <div class="modal-box">
            <div class="title-bar"><div class="title-stripes"></div><span class="title-text" id="error-title" data-i18n="torrents.error_title">Downloads Error</span></div>
            <div class="modal-content"><div id="error-message"></div><div class="button-row single"><button class="sys-btn primary" type="button" id="error-close" data-i18n="torrents.close">OK</button></div></div>
        </div>
    </div>

    <script>
        window.rekindleTorrentsFirebaseConfig = {
            apiKey: "__REKINDLE_FIREBASE_API_KEY__",
            authDomain: "rekindle-fork.firebaseapp.com",
            projectId: "rekindle-fork"
        };
    </script>
    <script src="js/torrents.js?v=2"></script>
</body>
</html>
