name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rekindle-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test
        run: node --test tests/*.test.js
      - name: Validate deploy script
        run: bash -n yandex/deploy-frontend-http.sh
      - name: Prepare frontend release
        env:
          REKINDLE_FIREBASE_API_KEY: ${{ secrets.REKINDLE_FIREBASE_API_KEY }}
          REKINDLE_YANDEX_RELEASE_DIR: ${{ runner.temp }}/rekindle-yandex-release
        run: node yandex/prepare-frontend-release.js
      - name: Exchange GitHub OIDC token for IAM token
        env:
          OIDC_AUDIENCE: https://github.com/yomanmf
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_CI_SERVICE_ACCOUNT_ID }}
        run: |
          encoded_audience=$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')
          id_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$encoded_audience" | jq -er '.value')
          iam_token=$(curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            --data-urlencode "audience=$YC_SERVICE_ACCOUNT_ID" \
            --data-urlencode "subject_token=$id_token" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
            https://auth.yandex.cloud/oauth/token | jq -er '.access_token')
          echo "::add-mask::$iam_token"
          echo "YC_IAM_TOKEN=$iam_token" >> "$GITHUB_ENV"
      - name: Upload and verify production
        env:
          REKINDLE_BUCKET: rekindle
          REKINDLE_YANDEX_RELEASE_DIR: ${{ runner.temp }}/rekindle-yandex-release
        run: yandex/deploy-frontend-http.sh
