<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>ReKindle+</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --shadow: 4px 4px 0 #000;
        }

        body {
            font-family: "Geneva", "Verdana", sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-sizing: border-box;
        }

        .window {
            background: white;
            border: 2px solid black;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .title-bar {
            height: 35px;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
            z-index: 0;
        }

        .title-text {
            background: white;
            padding: 0 15px;
            font-weight: bold;
            z-index: 1;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
        }

        .close-box {
            position: absolute;
            left: 10px;
            width: 18px;
            height: 18px;
            border: 2px solid black;
            background: white;
            z-index: 2;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: sans-serif;
            box-shadow: 2px 2px 0 black;
        }

        .window-content {
            padding: 30px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            text-transform: uppercase;
            border-bottom: 2px solid black;
            padding-bottom: 10px;
        }

        .section {
            display: none;
        }

        .secondary-btn {
            background: white;
            color: black;
            border: 2px solid black;
            padding: 8px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 black;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .secondary-btn:active,
        .close-box:active {
            background: black;
            color: white;
            box-shadow: none;
            transform: translate(1px, 1px);
        }

        #account-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #999;
            font-size: 0.8rem;
        }
    </style>
    <script src="js/i18n.js"></script>
    <script src="theme.js?v=21"></script>
</head>

<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <div class="close-box" onclick="window.location.href='settings'">X</div>
            <span class="title-text" data-i18n="pay.title">ReKindle+</span>
        </div>

        <div class="window-content">
            <div id="checking-section">
                <h2 data-i18n="pay.status.verifying">Verifying...</h2>
                <p data-i18n="pay.status.syncing">Syncing your membership status...</p>
            </div>

            <div id="login-section" class="section">
                <p data-i18n="pay.hint.guest">Log in to manage an existing subscription.</p>
                <button class="secondary-btn" onclick="window.location.href='index?login=true'"
                    data-i18n="pay.btn.login">Log In</button>
            </div>

            <div id="inactive-section" class="section">
                <p id="inactive-message" data-i18n="pay.status.inactive">No active subscription.</p>
            </div>

            <div id="subscribed-section" class="section">
                <h2 data-i18n="pay.status.active">ReKindle+ Active</h2>
                <p data-i18n="pay.status.thanks">Thank you for your support!</p>
                <p id="pay-expiry-date"></p>
                <a href="https://billing.stripe.com/p/login/28E6oGdgOf6b7qZ13K6Na00" target="_blank"
                    class="secondary-btn" data-i18n="pay.btn.manage">Manage Subscription on Stripe</a>
            </div>

            <div id="account-section" class="section">
                <span id="logged-in-text">Logged in as ...</span><br>
                <button class="secondary-btn" onclick="doLogout()" data-i18n="pay.btn.logout">Log Out</button>
            </div>
        </div>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "__REKINDLE_FIREBASE_API_KEY__",
            authDomain: "rekindle-fork.firebaseapp.com",
            projectId: "rekindle-fork",
            storageBucket: "rekindle-fork.firebasestorage.app",
            messagingSenderId: "136525921771",
            appId: "1:136525921771:web:1ab69288e786dbfd9e2dae"
        };
        var auth = null;
        var unsubscribeStatus = null;

        function showSection(id) {
            ['checking-section', 'login-section', 'inactive-section', 'subscribed-section'].forEach(function (sectionId) {
                document.getElementById(sectionId).style.display = sectionId === id ? 'block' : 'none';
            });
        }

        function showInactive(message) {
            showSection('inactive-section');
            if (message) document.getElementById('inactive-message').innerText = message;
        }

        function updateStatus(doc) {
            var data = doc.exists ? doc.data() : {};
            var expires = data.proExpiresAt && typeof data.proExpiresAt.toMillis === 'function'
                ? data.proExpiresAt.toMillis()
                : new Date(data.proExpiresAt || 0).getTime();

            if (!(expires > Date.now())) {
                showInactive();
                return;
            }

            showSection('subscribed-section');
            if (data.subscriptionType === 'lifetime') {
                document.getElementById('pay-expiry-date').innerText = window.t
                    ? window.t('pay.status.lifetime') : 'Lifetime Membership';
                return;
            }

            var date = new Date(expires);
            var dateText = window.rekindleFormatTime
                ? window.rekindleFormatTime(date, { year: 'numeric', month: 'long', day: 'numeric' })
                : date.toLocaleDateString();
            var key = data.subscriptionType === 'recurring' ? 'pay.status.renews' : 'pay.status.expires';
            var fallback = (data.subscriptionType === 'recurring' ? 'Renews: ' : 'Expires: ') + dateText;
            document.getElementById('pay-expiry-date').innerText = window.t
                ? window.t(key).replace('${date}', dateText) : fallback;
        }

        function handleAuth(user) {
            if (unsubscribeStatus) {
                unsubscribeStatus();
                unsubscribeStatus = null;
            }

            var accountSection = document.getElementById('account-section');
            if (!user) {
                accountSection.style.display = 'none';
                showSection('login-section');
                return;
            }

            accountSection.style.display = 'block';
            var template = window.t ? window.t('pay.auth.logged_in_as') : 'Logged in as ${email}';
            document.getElementById('logged-in-text').innerText = template.replace('${email}', user.email || '');
            showSection('checking-section');
            unsubscribeStatus = firebase.firestore().collection('users').doc(user.uid).onSnapshot(updateStatus, function () {
                showInactive('Subscription status unavailable.');
            });
        }

        function doLogout() {
            if (auth) auth.signOut();
        }

        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            auth.onAuthStateChanged(handleAuth);
        } catch (error) {
            showInactive('Subscription status unavailable.');
        }
    </script>
</body>

</html>
